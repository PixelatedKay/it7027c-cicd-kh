ame: "Terraform CI/CD Pipeline" 
 
on: 
  pull_request: 
    branches: 
      - main 
 
  push: 
    branches: 
      - main 
 
jobs: 
  terraform_pipeline: 
    name: "Infrastructure Pipeline" 
    runs-on: ubuntu-latest 
 
    steps: 
      - name: Checkout Code 
        uses: actions/checkout@v4 
 
      - name: Start MiniStack 
        run: | 
          docker run -d \ 
            --name ministack \ 
            -p 4566:4566 \ 
            ministackorg/ministack:latest 
 
      - name: Wait for MiniStack 
        run: | 
          for i in {1..60}; do 
            if curl -fsS \ 
              http://127.0.0.1:4566/_ministack/health; then 
              echo "MiniStack is ready!" 
              exit 0 
            fi 
            echo "Waiting for MiniStack..." 
            sleep 2 
          done 
 
          echo "MiniStack failed to become ready." 
          docker logs ministack 
          exit 1 
 
      - name: Setup Terraform 
        uses: hashicorp/setup-terraform@v3 
        with: 
          terraform_version: 1.7.0 
 
      - name: Terraform Format 
        run: terraform fmt -check 
 
      - name: Terraform Init 
        run: terraform init 
 
      - name: Terraform Validate 
        run: terraform validate 
 
      - name: Terraform Plan 
        if: github.event_name == 'pull_request' 
        run: terraform plan -no-color 
 
      - name: Terraform Apply 
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' 
        run: terraform apply -auto-approve 

 
